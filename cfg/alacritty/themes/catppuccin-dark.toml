# Catppuccin Mocha, darker variant: background uses "crust" instead of "base"
[colors.primary]
background = '#11111b' # crust
foreground = '#cdd6f4' # text
dim_foreground = '#7f849c'
bright_foreground = '#cdd6f4'

[colors.cursor]
text = '#11111b'
cursor = '#f5e0dc' # rosewater

[colors.vi_mode_cursor]
text = '#11111b'
cursor = '#b4befe' # lavender

[colors.selection]
text = 'CellForeground'
background = '#313244' # surface0

[colors.search]
matches = { foreground = '#11111b', background = '#a6adc8' }
focused_match = { foreground = '#11111b', background = '#a6e3a1' }

[colors.footer_bar]
foreground = '#11111b'
background = '#a6adc8'

[colors.hints]
start = { foreground = '#11111b', background = '#f9e2af' }
end = { foreground = '#11111b', background = '#a6adc8' }

