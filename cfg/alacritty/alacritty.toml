[general]
import = [
    # "~/.config/alacritty/themes/camila.toml"
    "~/.config/alacritty/themes/catppuccin-dark.toml"
]

[window]
padding = { x = 0, y = 0 }
dynamic_padding = true # when zoomed, split the leftover pixels between top and bottom
opacity = 0.90
blur = false



[font]
size = 13.0
# 28px + 4 = 32px rows: 23 rows fill exactly 768 - 32 (eww bar) = 736px, no gap
offset = { x = 0, y = 4 }
# normal = { family = "JetBrainsMonoNL Nerd Font", style = "Regular" }
normal = { family = "Iosevka Nerd Font Mono", style = "Regular" }
# normal = { family = "Iosevka Nerd Font Propo", style = "Regular" }

[cursor]
style = { shape = "Beam", blinking = "Always" }

[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"

# [[keyboard.bindings]]
# key = "C"
# mods = "Control"
# action = "Copy"
