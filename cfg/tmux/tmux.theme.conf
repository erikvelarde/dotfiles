# ============================================================================
# Theme - matches the qtile eww sidebar (qtile/widgets/sidebar/eww.scss)
# Requires a Nerd Font for the rounded pill glyphs
# ============================================================================
#   bg      #131519   surface #1c1f26   track #2a2e36   fg    #abb2bf
#   dim     #4b5263   white   #dcdfe4   red   #e16b75   green #97c379
#   yellow  #e5c07b   blue    #61afef   magenta #c678dd cyan  #56b6c2

# ----------------------------------------------------------------------------
# Status bar - windows in center, position bottom
# ----------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify centre
set -g status-interval 5
set -g status-style "fg=#abb2bf,bg=default"
set -g status-left-length 40
set -g status-right-length 100

# Session pill: blue normally, red while prefix is held, yellow in copy mode
set -g status-left "#[fg=#{?client_prefix,#e16b75,#{?pane_in_mode,#e5c07b,#61afef}},bg=default]#[fg=#131519,bg=#{?client_prefix,#e16b75,#{?pane_in_mode,#e5c07b,#61afef}},bold] #S #[fg=#{?client_prefix,#e16b75,#{?pane_in_mode,#e5c07b,#61afef}},bg=default,nobold]"

# Git info (branch, changed files, ahead/behind) of the active pane
set -g status-right "#(~/.config/tmux/scripts/git-status '#{pane_current_path}')"

# Windows: dim when inactive, cyan pill when active (zoom shows an icon)
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#4b5263] #I #[fg=#abb2bf]#W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#56b6c2,bg=default]#[fg=#131519,bg=#56b6c2,bold]#I #W#{?window_zoomed_flag, 󰊓,}#[fg=#56b6c2,bg=default,nobold]"
setw -g window-status-activity-style "fg=#e5c07b"
setw -g window-status-bell-style "fg=#e16b75,bold"

# ----------------------------------------------------------------------------
# Panes
# ----------------------------------------------------------------------------
set -g pane-border-lines single
set -g pane-border-style "fg=#2a2e36,bg=default"
set -g pane-active-border-style "fg=#56b6c2,bg=default"
set -g display-panes-colour "#4b5263"
set -g display-panes-active-colour "#56b6c2"

# ----------------------------------------------------------------------------
# Messages, command prompt, menus and popups
# ----------------------------------------------------------------------------
set -g message-style "fg=#dcdfe4,bg=#1c1f26"
set -g message-command-style "fg=#e5c07b,bg=#1c1f26"
set -g menu-style "fg=#abb2bf,bg=#1c1f26"
set -g menu-selected-style "fg=#131519,bg=#56b6c2"
set -g menu-border-style "fg=#2a2e36"
set -g menu-border-lines rounded
set -g popup-style "bg=#131519"
set -g popup-border-style "fg=#56b6c2"
set -g popup-border-lines rounded

# ----------------------------------------------------------------------------
# Copy mode
# ----------------------------------------------------------------------------
set -g mode-style "fg=#dcdfe4,bg=#2a2e36"
set -g copy-mode-match-style "fg=#131519,bg=#e5c07b"
set -g copy-mode-current-match-style "fg=#131519,bg=#c678dd,bold"
setw -g clock-mode-colour "#56b6c2"
