include-file = ./colors.ini
include-file = ./modules/qtile.ini
include-file = ./modules/audio.ini
include-file = ./modules/space.ini
include-file = ./modules/time.ini
include-file = ./modules/memory.ini
include-file = ./modules/cpu.ini
include-file = ./modules/disk.ini
include-file = ./modules/brightness.ini
include-file = ./modules/network.ini
include-file = ./modules/title.ini

[bar/main]
bottom = true
monitor = LVDS1
; monitor = ${env:MONITOR:fallback-value}
monitor-strict = false
override-redirect = false

fixed-center = true

width = 100%
height = 21px
offset-x = 0%
offset-y = 0

background = ${colors.bg}
foreground = ${colors.fg}

radius-top = 0
radius-bottom = 0

line-size = 0
line-color = ${colors.red}


border-size = 2
border-color = ${colors.bg}
padding-left = 0
padding-right = 1
module-margin-left = 0
module-margin-right = 0


font-0 = "JetBrains Mono:bold:size=10;3"
font-1 = "Symbols Nerd Font:size=12;3"
font-2 = "Symbols Nerd Font:size=24;5"
font-3 = "Iosevka Nerd Font:bold:size=12;4"
font-4 = "archcraft:size=14;4"
font-5 = "Symbols Nerd Font:size=14;3"
font-6 = "Symbols Nerd Font:size=16;3"


modules-left = memory space cpu space disk space title
modules-center = qtile
modules-right = time space brightness space audio space network

separate = true
spacing = 0

dim-value = 1.0

wm-name = qtile
locale = 

[bar/secondary]
inherit = bar/main
monitor = VGA1
modules-right = time space audio space network
