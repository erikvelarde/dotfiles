# Apps the Resources widget may list and kill.  Format:  Label|regex
# The regex is matched (case-insensitive) against the executable path of each
# process; the first matching line wins.  System, Qtile and widget processes
# (Xorg, picom, eww, rofi...) are never listed unless you add them here.
Firefox|firefox
Chrome|chrome
Postman|postman
Java|(^|/)java$
Terminals|(^|/)(alacritty|kitty|xterm|foot|wezterm|urxvt|gnome-terminal[^/]*|konsole)$
VS Code|(^|/)(code|code-oss|codium)$
Discord|discord
Slack|slack
Spotify|spotify
Telegram|telegram

# Terminals that are an ancestor of any process matching this regex (comm) are
# never killed, so cleaning does not take down the shell running Claude.
#PROTECT=claude|tmux
